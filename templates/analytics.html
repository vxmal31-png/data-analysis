{% extends "base.html" %}
{% block content %}
<section class="page-heading">
  <div><p class="eyebrow">ANALYTICS</p><h1>Visitor Analytics</h1><p>Visualize historical values from the real dataset.</p></div>
</section>
<section class="metric-grid analytics-metrics" id="analyticsMetrics"></section>
<section class="dashboard-grid">
  <article class="panel trend-panel"><div class="panel-header"><div><p class="eyebrow">HISTORICAL DATA</p><h3>Daily visitor trend</h3></div></div><div class="chart-wrap"><canvas id="trendChart"></canvas></div></article>
  <article class="panel"><div class="panel-header"><div><p class="eyebrow">DISTRIBUTION</p><h3>Visitor range</h3></div></div><div class="chart-wrap small"><canvas id="distributionChart"></canvas></div></article>
</section>
<section class="panel correlation-panel"><div class="panel-header"><div><p class="eyebrow">FEATURE RELATIONSHIP</p><h3>Numeric correlation</h3></div></div><div class="chart-wrap"><canvas id="correlationChart"></canvas></div></section>
<script>window.pageChart = "analytics";</script>
{% endblock %}
